[project]
name = "agent-practice-index"
version = "0.1.0"
description = "A machine-readable, evidence-graded, freshness-tracked index of current industry practice for building AI agent systems - written to be read by agents at the top of a loop iteration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2"]

[project.scripts]
practice = "agent_practice_index.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-xdist>=3.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_practice_index"]

[tool.pytest.ini_options]
addopts = "-q -n auto"
testpaths = ["tests"]
